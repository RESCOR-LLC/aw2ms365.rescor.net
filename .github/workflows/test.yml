name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, both Node versions as steps: GitHub bills each job rounded up to a whole minute.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: npm test (Node 20)
        run: npm test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: npm test (Node 22)
        run: npm test
