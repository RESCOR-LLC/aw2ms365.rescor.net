name: Secret Scan

# Gitleaks + Kingfisher over the full git history on every push and PR.
#
# This repository is public, so the jobs are built to publish nothing sensitive:
#   * both tools run with redaction, and their reports stay on the runner (no artifacts);
#   * Kingfisher runs with --no-validate, so no candidate is checked against its provider
#     and no run reveals whether a credential is live;
#   * job summaries list rule, file, line and commit only, never a matched value.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job, both scanners as steps: GitHub bills each job rounded up to a whole minute.
# The Kingfisher steps run even when Gitleaks fails, so one finding never hides the other.
jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        # --redact and no --verbose: the log carries only Gitleaks' count line. The summary is
        # built from the JSON report's rule, file, line and commit fields only.
        run: |
          report="$RUNNER_TEMP/gitleaks-report.json"
          set +e
          gitleaks detect --source . --redact --no-banner \
            --report-format json --report-path "$report"
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            python3 - "$report" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1]) as handle:
                  findings = json.load(handle) or []
          except (OSError, ValueError) as error:
              findings = []
              print(f"_No readable report ({error})._")

          print("## Gitleaks: potential secret detected")
          print()
          print(f"**{len(findings)} finding(s).**")
          print()
          print("| Rule | File | Line | Commit |")
          print("|------|------|-----:|--------|")
          for finding in findings[:60]:
              commit = (finding.get("Commit") or "")[:12]
              print(f"| `{finding.get('RuleID', '?')}` | `{finding.get('File', '?')}` | {finding.get('StartLine', '?')} | `{commit}` |")
          print()
          print("A reviewed false positive goes in `.gitleaksignore`; a real secret must be rotated.")
          PY
            echo "::error::Gitleaks detected potential secrets; see the job summary"
            exit 1
          fi
          echo "Gitleaks: no secrets detected" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Kingfisher
        if: ${{ !cancelled() }}
        # Downloaded to $RUNNER_TEMP, never into the checkout, so the scan cannot see it.
        env:
          KINGFISHER_VERSION: 2.17.0
          KINGFISHER_SHA256: 8798879183d74f9e1379af3071f296853e4027a21bfde5d13d9b064fa1bf1eb3
        run: |
          archive="$RUNNER_TEMP/kingfisher.tgz"
          curl -sSfL -o "$archive" \
            "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/kingfisher-linux-x64.tgz"
          echo "${KINGFISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" -C /usr/local/bin kingfisher

      - name: Run Kingfisher
        if: ${{ !cancelled() }}
        # Report mode: findings are listed in the summary and as warnings; the job passes.
        # Exit codes: 0 none, 200 findings, 1-3 tool errors (a tool error fails the job).
        run: |
          report="$RUNNER_TEMP/kingfisher-report.json"
          set +e
          kingfisher scan . --git-history full --redact --no-validate --format json \
            --confidence low --output "$report" --no-update-check --quiet
          rc=$?
          set -e

          python3 - "$rc" "$report" <<'PY'
          import json
          import os
          import sys

          exit_status = int(sys.argv[1])
          lines = ["## Kingfisher", ""]
          findings = []
          try:
              with open(sys.argv[2]) as handle:
                  findings = json.load(handle).get("findings") or []
          except (OSError, ValueError) as error:
              lines.append(f"_No readable report ({error})._")

          tool_error = exit_status not in (0, 200)
          if tool_error:
              lines.append(f"**Kingfisher did not complete (exit {exit_status}).** Coverage is unknown.")
          elif not findings:
              lines.append("No secrets found in the working tree or git history.")
          else:
              lines += [f"**{len(findings)} finding(s).**", "",
                        "| Rule | File | Line | Commit |", "|------|------|-----:|--------|"]
              for entry in findings[:60]:
                  finding = entry.get("finding") or {}
                  rule = (entry.get("rule") or {}).get("id", "?")
                  commit = (((finding.get("git_metadata") or {}).get("commit") or {}).get("id") or "")[:12]
                  lines.append(f"| `{rule}` | `{finding.get('path', '?')}` | {finding.get('line', '?')} | `{commit}` |")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")

          for entry in findings[:20]:
              finding = entry.get("finding") or {}
              rule = (entry.get("rule") or {}).get("id", "?")
              print(f"::warning file={finding.get('path', '?')},line={finding.get('line', 1)}::Kingfisher {rule}")
          sys.exit(1 if tool_error else 0)
          PY
