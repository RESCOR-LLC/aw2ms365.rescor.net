name: Secret Scan

# Gitleaks + Kingfisher on every push and PR (PROJECT-PATTERNS, plans #54).
#
# This is an INLINE COPY of the jobs in RESCOR-LLC/core.rescor.net
# .github/workflows/reusable-secret-scan.yml (core commit a3e3ce5), not a `uses:` call:
# this repository is public and core is private, and GitHub does not let a public
# repository call a reusable workflow in a private one. When core's jobs change, re-copy
# them here. Inputs are fixed: runner ubuntu-24.04, kingfisher-mode report.
#
# Neither job prints a matched value: both tools run with --redact and the summaries are
# built from rule/file/line/commit fields only.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" -C /usr/local/bin gitleaks

      - name: Run Gitleaks
        # NEVER print a matched value. Until 2026-11-07 this ran `--verbose` without `--redact`,
        # which wrote every matched secret (Secret: and Match: lines) into the Actions log and
        # the report artifact; the summary's sed hid only Secret:. Now:
        #   * `--redact` replaces Secret and Match with REDACTED in every output;
        #   * no `--verbose`, so the log carries only Gitleaks' own count line;
        #   * the summary is built from the JSON report's rule, file, line and commit fields
        #     only, so it stays value-free even if redaction ever regressed.
        # The summary names which rule fired in which file, so the failure email links to a
        # page that already says what to look at.
        id: gitleaks
        run: |
          set +e
          gitleaks detect --source . --redact --no-banner \
            --report-format json --report-path gitleaks-report.json
          rc=$?
          set -e

          if [ $rc -ne 0 ]; then
            {
              echo "## Gitleaks: secret detected"
              echo ""
              echo "Gitleaks identified one or more potential secrets in the repository."
              echo "The redacted report is attached as the \`gitleaks-report\` artifact."
              echo ""
              echo "### Findings"
              echo ""
              python3 - <<'PY'
          import json

          try:
              with open("gitleaks-report.json") as handle:
                  findings = json.load(handle) or []
          except (OSError, ValueError) as error:
              findings = []
              print(f"_No readable report ({error})._")

          print(f"**{len(findings)} finding(s).**")
          print()
          print("| Rule | File | Line | Commit |")
          print("|------|------|-----:|--------|")
          for finding in findings[:60]:
              rule = finding.get("RuleID", "?")
              path = finding.get("File", "?")
              line = finding.get("StartLine", "?")
              commit = (finding.get("Commit") or "")[:12]
              print(f"| `{rule}` | `{path}` | {line} | `{commit}` |")
          if len(findings) > 60:
              print()
              print(f"_{len(findings) - 60} further finding(s) in the artifact._")
          PY
              echo ""
              echo "### Recommended action"
              echo ""
              echo "1. Confirm whether the matched string is actually a secret or a false positive."
              echo "2. If real: rotate the secret immediately, then scrub it from git history (\`git filter-repo\` or BFG)."
              echo "3. If false positive: add a \`.gitleaks.toml\` allowlist rule scoped to the specific file/line."
              echo ""
              echo "**Do not commit the report file or paste it into a public issue.**"
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Gitleaks detected potential secrets — see job summary for affected files and remediation steps"
            exit 1
          else
            echo "Gitleaks: no secrets detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 30

  kingfisher:
    name: Kingfisher Secret Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Kingfisher
        # Downloaded to $RUNNER_TEMP, never into the checkout, so the scan cannot see it.
        env:
          KINGFISHER_VERSION: 2.17.0
          KINGFISHER_SHA256: 8798879183d74f9e1379af3071f296853e4027a21bfde5d13d9b064fa1bf1eb3
        run: |
          archive="$RUNNER_TEMP/kingfisher.tgz"
          curl -sSfL -o "$archive" \
            "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/kingfisher-linux-x64.tgz"
          echo "${KINGFISHER_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" -C /usr/local/bin kingfisher

      - name: Run Kingfisher
        # Full git history, live validation ON (Kingfisher's default: each candidate is checked
        # against its provider, so the summary says whether a credential is still active), and
        # `--redact`, which replaces the snippet and the validation response with a hash. Output
        # goes only to the JSON report; `--quiet` keeps the log free of findings. The summary is
        # built from rule, path, line, commit and validation outcome only.
        #
        # Kingfisher is NOT a superset of Gitleaks. Its catalog deliberately excludes the broad
        # generic-api-key / generic-password rules and covers provider-specific formats, so a bare
        # 64-hex Infisical client secret matched nothing until the RESCOR rule below was added
        # (found 2026-11-07: Gitleaks caught one in core's history, Kingfisher reported 0). Keep
        # both scanners. Add a rule here for any RESCOR credential format Kingfisher misses.
        # Infisical is self-hosted, so the rule has no validator: outcome is `not_attempted`.
        #
        # `report` mode scans at `--confidence low`, so every candidate is listed with its
        # validation state; `enforce` uses the default `medium`, so low-confidence noise cannot
        # fail a build.
        #
        # Exit codes: 0 none, 200 findings, 205 validated (active) findings, 1-3 tool errors.
        # `report` mode passes the job in every case and raises warnings; `enforce` fails it.
        env:
          KINGFISHER_MODE: report
        run: |
          rules="$RUNNER_TEMP/rescor-kingfisher-rules.yml"
          cat > "$rules" <<'RULES'
          rules:
            - name: Infisical Universal Auth Client Secret
              id: custom.rescor.infisical-client-secret
              pattern: |
                (?xi)
                (?:infisical[_-]?client[_-]?secret|client[_-]?secret)
                ["']?\s*[:=]\s*["']?
                \b([a-f0-9]{64})\b
              min_entropy: 3.0
              confidence: medium
              examples:
                - INFISICAL_CLIENT_SECRET=1d9c6b0e8f42a7351c0e9b6d2f84a3c7e5b19d0a6c3f72e8b4d1a09c5e6f3b27  # gitleaks:allow kingfisher:ignore
              negative_examples:
                - INFISICAL_CLIENT_SECRET=<your-client-secret>
          RULES

          confidence=low
          if [ "$KINGFISHER_MODE" = "enforce" ]; then
            confidence=medium
          fi

          set +e
          kingfisher scan . --git-history full --redact --format json \
            --rules-path "$rules" --confidence "$confidence" \
            --output "$RUNNER_TEMP/kingfisher-report.json" --no-update-check --quiet
          rc=$?
          set -e

          python3 - "$rc" "$RUNNER_TEMP/kingfisher-report.json" <<'PY'
          import json
          import os
          import sys

          exit_status = int(sys.argv[1])
          report_path = sys.argv[2]
          enforce = os.environ.get("KINGFISHER_MODE") == "enforce"
          summary_lines = ["## Kingfisher", ""]
          findings = []
          partial = 0

          try:
              with open(report_path) as handle:
                  report = json.load(handle)
              findings = report.get("findings") or []
              audit_summary = (report.get("audit") or {}).get("summary") or {}
              partial = audit_summary.get("scan_partial", 0) + audit_summary.get("scan_failed", 0)
          except (OSError, ValueError) as error:
              summary_lines.append(f"_No readable report ({error})._")

          tool_error = exit_status not in (0, 200, 205)
          active = [entry for entry in findings
                    if ((entry.get("finding") or {}).get("validation") or {}).get("outcome") == "verified_active"]

          if tool_error:
              summary_lines.append(f"**Kingfisher did not complete (exit {exit_status}).** Coverage is unknown.")
          elif not findings:
              summary_lines.append("No secrets found in the working tree or git history.")
          else:
              summary_lines.append(f"**{len(findings)} finding(s), {len(active)} validated as ACTIVE.**")
              summary_lines += ["", "| Rule | File | Line | Commit | Validation |",
                                "|------|------|-----:|--------|------------|"]
              for entry in findings[:60]:
                  finding = entry.get("finding") or {}
                  rule = (entry.get("rule") or {}).get("id", "?")
                  commit = (((finding.get("git_metadata") or {}).get("commit") or {}).get("id") or "")[:12]
                  outcome = (finding.get("validation") or {}).get("outcome", "?")
                  summary_lines.append(
                      f"| `{rule}` | `{finding.get('path', '?')}` | {finding.get('line', '?')} | `{commit}` | {outcome} |")
              if len(findings) > 60:
                  summary_lines += ["", f"_{len(findings) - 60} further finding(s) in the artifact._"]
              summary_lines += ["", "An ACTIVE credential must be rotated now, then scrubbed from history.",
                                "**Do not commit the report file or paste it into a public issue.**"]
          if partial:
              summary_lines += ["", f"_Partial coverage: {partial} scan target(s) did not complete._"]
          summary_lines += ["", f"Mode: `{'enforce' if enforce else 'report'}`."]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(summary_lines) + "\n")

          level = "error" if enforce else "warning"
          for entry in findings[:20]:
              finding = entry.get("finding") or {}
              rule = (entry.get("rule") or {}).get("id", "?")
              print(f"::{level} file={finding.get('path', '?')},line={finding.get('line', 1)}::Kingfisher {rule}")

          failed = tool_error or bool(findings)
          if failed:
              print(f"::{level}::Kingfisher: {'tool error' if tool_error else f'{len(findings)} finding(s)'} -- see job summary")
          sys.exit(1 if failed and enforce else 0)
          PY

      - name: Upload Kingfisher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingfisher-report
          path: ${{ runner.temp }}/kingfisher-report.json
          if-no-files-found: ignore
          retention-days: 30
